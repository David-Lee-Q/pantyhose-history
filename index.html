<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>丝袜的故事</title>
  <link rel="stylesheet" href="styles.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="shell">

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" data-route="home">丝袜<span>的故事</span></a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home">首页</a>
        <a href="#/timeline" data-route="timeline">时间轴</a>
        <a href="#/material" data-route="material">材料</a>
        <a href="#/process" data-route="process">工艺</a>
        <a href="#/style" data-route="style">样式</a>
        <a href="#/company" data-route="company">企业</a>
        <a href="#/guide" data-route="guide">科普指南</a>
      </nav>
      <div class="topbar-right">
        <button class="icon-btn" id="favBtn" title="我的收藏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="lang-btn" id="langBtn">EN</button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main" id="app"></main>

  <!-- 悬浮选购助手按钮 -->
  <a href="#/assistant" class="assistant-fab" id="fab">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    选购助手
  </a>

  <!-- 页脚 -->
  <footer class="footer">
    <p>丝袜的故事 · 纯前端科普原型 · 企业发展历程整理自企业官网与公开报道</p>
    <p style="margin-top:6px">参考来源：杜邦 / LYCRA Company / 福助 / 厚木 / 浪莎 / 梦娜 / Fogal / Wolford 等企业公开资料</p>
  </footer>
</div>

<!-- 年龄确认弹窗 -->
<div class="modal-mask" id="ageModal">
  <div class="modal">
    <h3 id="ageTitle">年龄确认</h3>
    <p id="ageDesc">本应用包含穿搭展示内容，请确认您已年满 16 周岁</p>
    <div class="actions">
      <button class="btn btn-primary" id="ageConfirm">确认</button>
      <button class="btn btn-ghost" id="ageUnder" style="color:var(--c-ink);border-color:var(--c-line)">未满 16 岁</button>
    </div>
  </div>
</div>

<!-- 18+ 图片确认弹窗 -->
<div class="modal-mask" id="adultModal">
  <div class="modal">
    <h3>内容提示</h3>
    <p id="adultDesc">本图片可能包含成熟内容，确认查看？</p>
    <div class="actions">
      <button class="btn btn-primary" id="adultConfirm">确认查看</button>
      <button class="btn btn-ghost" style="color:var(--c-ink);border-color:var(--c-line)" id="adultCancel">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="mock.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
